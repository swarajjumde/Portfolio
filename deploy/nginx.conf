# ---------------------------------------------------------------------------
# Portfolio ka nginx config (static Vue site).
# Server pe ye /etc/nginx/sites-available/portfolio banta hai.
#
#   browser ──> nginx ──> Vue ki bani hui files (web/dist)
#
# Ye Samay se alag site hai (alag server_name), dono ek hi server pe saath chal sakte hain.
# DuckDNS pe naya subdomain bana (jaise swarajjumde.duckdns.org) jo isi server-IP pe jaye,
# aur neeche server_name mein wahi daal.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    # Apna domain/subdomain yahan. Abhi DuckDNS:
    server_name swarajjumde.duckdns.org;

    root /var/www/portfolio/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite ki hashed files — browser 1 saal cache kar sakta hai
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vue SPA: file mile to do, warna index.html (phir Vue Router sambhalta hai)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
